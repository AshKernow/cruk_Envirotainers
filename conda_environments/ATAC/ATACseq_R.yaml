name: ATACseq_R
channels:
  - conda-forge
  - bioconda
  - defaults
dependencies:
  - r-base=4.6
  - quarto
  # Build toolchain. Everything is compiled from source, so the env needs
  # its own pkg-config (otherwise configure scripts fall back to the host's
  # /usr/bin/pkg-config and pick up system headers, e.g. Cairo). sysroot and
  # kernel-headers are pinned to the host OS (RHEL 8, glibc 2.28) so built
  # binaries don't need a newer GLIBC than the host provides.
  - pkg-config
  - make
  - sysroot_linux-64=2.28
  - kernel-headers_linux-64=4.18.0
  # Development libraries (headers + unversioned .so links). conda-forge
  # ships runtime-only packages (libzlib, liblzma, libfreetype) as r-base
  # dependencies; the compile/link steps need the -devel counterparts.
  - zlib            # zlib.h, -lz: Rhtslib, XVector, data.table, png, httpuv, haven, Rhdf5lib
  - liblzma-devel   # -llzma: Rhtslib, RCurl, igraph, xml2
  - bzip2           # -lbz2: Rhtslib
  - libxml2-devel   # -lxml2 / xml2-config: XML, xml2, RCurl, igraph
  - libcurl         # RCurl, Rhtslib, curl
  - openssl
  - freetype        # -lfreetype: systemfonts, textshaping, Cairo
  - fontconfig      # systemfonts, Cairo
  - cairo           # Cairo
  - xorg-xorgproto  # X11/X.h etc. (protocol headers): Cairo's X11 backend
  - xorg-libx11     # -lX11: Cairo
  - xorg-libxext    # -lXext: Cairo
  - xorg-libxrender # -lXrender: Cairo
  - xorg-libxt      # Cairo (optional Xt support)
  - harfbuzz        # textshaping
  - fribidi         # textshaping
  - libpng          # png, ragg
  - libjpeg-turbo   # ragg
  - libtiff         # ragg
  - libwebp         # ragg
  - glpk            # igraph
  - gmp             # igraph
  - gsl             # some Bioconductor deps (e.g. DirichletMultinomial)
  - zstd
  - libdeflate
  # All R CRAN and Bioconductor packages are installed manually via
  # BiocManager::install() (see PackagesToInstall.txt) because none
  # currently have bioconda/conda-forge builds for R 4.6 / Bioconductor
  # 3.23. As bioconda catches up, packages can be moved back here.
