name: RNAseq_R4.6
channels:
  - bioconda
  - conda-forge
  - defaults
  - r
dependencies:
  # R
  - r-base=4.6.1
  # Reporting
  - quarto=1.9.38
  # Build toolchain (needed to compile R/Bioconductor packages from source,
  # since none of them have bioconda/conda-forge builds for R 4.6 yet).
  # sysroot_linux-64/kernel-headers_linux-64 are pinned to match the host
  # OS's actual glibc (2.28, RHEL 8) - letting the solver pick newer ones
  # produces binaries that need a newer GLIBC than the host provides,
  # which fails at runtime with "GLIBC_2.3x not found".
  - gcc_impl_linux-64
  - gxx_impl_linux-64
  - gfortran_impl_linux-64
  - libgcc-devel_linux-64
  - libstdcxx-devel_linux-64
  - libsanitizer
  - binutils_impl_linux-64
  - ld_impl_linux-64
  - kernel-headers_linux-64=4.18.0
  - sysroot_linux-64=2.28
  - make
  - pkg-config
  # Native/system libraries harvested from the working RNAseq_R (R 4.5)
  # environment, so BiocManager::install() has everything it needs to
  # build packages from source without re-discovering each dependency.
  - _openmp_mutex
  - _r-mutex
  - adwaita-icon-theme
  - aom
  - argcomplete
  - at-spi2-atk
  - at-spi2-core
  - atk-1.0
  - blosc
  - bwidget
  - bzip2
  - c-ares
  - ca-certificates
  - cairo
  - curl
